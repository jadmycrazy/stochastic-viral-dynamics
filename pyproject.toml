[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-viral-dynamics"
version = "0.2.0"
description = "Stochastic models of early within-host HIV infection: Gillespie simulation, chemical Langevin equation and branching-process theory."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jad Almajnouni" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
viral-dynamics = "viral.cli:main"

[project.urls]
Repository = "https://github.com/jadmycrazy/stochastic-viral-dynamics"
"Project page" = "https://jadmycrazy.github.io/virus.html"

[tool.setuptools]
packages = ["viral"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
